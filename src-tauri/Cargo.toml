[package]
name = "tauri-app"
version = "1.0.0-beta.7"
description = "A local-first Markdown workspace for Obsidian-compatible vaults"
authors = ["Glyphary contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
glyphary-folder-picker = { path = "folder-picker" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-macos-permissions = "2.3.0"
tauri-plugin-window-state = "2"
grep = "0.3"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSButton", "NSControl", "NSView", "NSWindow"] }
