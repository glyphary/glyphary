<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glyphary</title>
    <script>
      // Without this, excalidraw fetches fonts from the esm.sh CDN and every
      // preview export fails offline. /fonts is populated by
      // scripts/copy-excalidraw-fonts.mjs.
      window.EXCALIDRAW_ASSET_PATH = "/";
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: transparent;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
